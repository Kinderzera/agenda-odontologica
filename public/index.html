<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a10" />
  <title>Clínica Odontológica Jacupiranga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="tela-login" class="login">
    <div class="login__marca">
      <img class="login__marca-foto" src="assets/dra-mayra.png" alt="Dra. Mayra Silva, Cirurgiã-Dentista, no consultório da Clínica Odontológica Jacupiranga" />
      <div class="login__marca-sombra"></div>
      <div class="login__marca-texto">
        <h1 class="login__titulo">Agendamento de clientes</h1>
        <p class="login__subtitulo">Clínica Odontológica Jacupiranga</p>
      </div>
    </div>

    <div class="login__painel">
      <form id="form-login" class="login__form">
        <div class="campo">
          <label>USUÁRIO</label>
          <div class="campo-icone">
            <input type="text" name="usuario" autocomplete="username" required autofocus />
          </div>
        </div>
        <div class="campo">
          <label>SENHA</label>
          <div class="campo-icone">
            <input type="password" name="senha" autocomplete="current-password" required id="campo-senha" />
            <button type="button" class="botao-olho" id="btn-mostrar-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-entrar">ENTRAR →</button>
        <p class="login__rodape">Uso interno do consultório</p>
        <p class="login__credito">Desenvolvido por Guilherme Kinder</p>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img class="logo-icone" src="assets/logo.png" alt="Logo da Clínica Odontológica Jacupiranga" />
        <span class="sidebar__brand-nome">Clínica Jacupiranga<small>Agenda odontológica</small></span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tabs__btn is-active" data-view="agenda">
          <span class="tabs__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01"/></svg></span>
          <span>Agenda</span>
        </button>
        <button class="tabs__btn" data-view="pacientes">
          <span class="tabs__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c.7-3.6 3.2-5.4 6.2-5.4s5.5 1.8 6.2 5.4"/><path d="M16.2 5.1a3.4 3.4 0 0 1 0 5.8"/><path d="M17.8 14.9c1.9.8 3 2.4 3.4 5.1"/></svg></span>
          <span>Pacientes</span>
        </button>
        <button class="tabs__btn" data-view="profissionais">
          <span class="tabs__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3H4a1 1 0 0 0-1 1v4a6 6 0 0 0 12 0V4a1 1 0 0 0-1-1h-1"/><path d="M9 14v2.5a5.5 5.5 0 0 0 11 0V15"/><circle cx="20" cy="12.5" r="2.2"/></svg></span>
          <span>Profissionais</span>
        </button>
        <button class="tabs__btn" data-view="fechamento" id="tab-fechamento" hidden>
          <span class="tabs__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M15 8.8c-.6-1-1.7-1.4-3-1.4-1.6 0-2.8.8-2.8 2.1 0 2.9 6 1.6 6 4.6 0 1.4-1.3 2.2-3.2 2.2-1.5 0-2.7-.6-3.3-1.6"/></svg></span>
          <span>Fechamento</span>
        </button>
        <button class="tabs__btn" data-view="usuarios" id="tab-usuarios" hidden>
          <span class="tabs__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15.5" r="4.5"/><path d="M11.2 12.3 20 3.5M15.5 8l2.8 2.8M18.2 5.3 21 8.1"/></svg></span>
          <span>Usuários</span>
        </button>
      </nav>
      <div class="sidebar__usuario">
        <div class="sidebar__perfil">
          <img class="avatar-usuario" id="avatar-usuario" alt="" />
          <span id="nome-usuario"></span>
        </div>
        <button class="btn-sair" id="btn-sair" title="Sair" aria-label="Sair">⏻</button>
      </div>
    </aside>

    <main id="app" class="app"></main>
  </div>

  <div id="modal-root"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
